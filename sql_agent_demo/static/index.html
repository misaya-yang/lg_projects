<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SQL Agent Chat</title>
  <style>
    body { font-family: sans-serif; margin:0; height:100vh; display:flex; flex-direction:column; background:#f1f5f9; }
    .header { background:#4f46e5; color:white; padding:1rem; text-align:center; }
    .controls { display:flex; align-items:center; gap:1rem; padding:0.5rem; background:white; }
    .messages { flex:1; overflow-y:auto; padding:1rem; }
    .message { margin-bottom:0.75rem; }
    .message.user { text-align:right; }
    .tool { color:#dc2626; animation:pulse 1s infinite; }
    @keyframes pulse {0%{opacity:0.2;}50%{opacity:1;}100%{opacity:0.2;}}
    form { display:flex; gap:0.5rem; padding:0.5rem; background:white; }
    textarea { flex:1; resize:none; }
  </style>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const AGENTS = [
      { name: "SQL Agent", url: "http://127.0.0.1:8000" },
      { name: "Multi Agent", url: "http://127.0.0.1:8001" }
    ];

    function App() {
      const [agent, setAgent] = React.useState(AGENTS[0]);
      const [messages, setMessages] = React.useState([]);
      const [input, setInput] = React.useState("");
      const [tool, setTool] = React.useState(null);
      const endRef = React.useRef(null);

      React.useEffect(() => {
        endRef.current?.scrollIntoView({ behavior: "smooth" });
      }, [messages]);

      const send = (e) => {
        e.preventDefault();
        if (!input.trim()) return;
        setMessages(m => [...m, { role: "user", content: input }]);
        const es = new EventSource(`${agent.url}/chat/stream?message=${encodeURIComponent(input)}`);
        setInput("");
        let assistant = { role: "assistant", content: "" };
        setMessages(m => [...m, assistant]);
        es.onmessage = (ev) => {
          const data = ev.data;
          if (data.startsWith("[tool]")) {
            setTool(data.slice(6));
            return;
          }
          assistant = { ...assistant, content: assistant.content + data };
          setMessages(m => [...m.slice(0, -1), assistant]);
        };
        es.onerror = () => { es.close(); setTool(null); };
      };

      return (
        <div style={{display:"flex",flexDirection:"column",height:"100%"}}>
          <div className="header">SQL Agent 前端</div>
          <div className="controls">
            <select value={agent.url} onChange={e => setAgent(AGENTS.find(a => a.url === e.target.value))}>
              {AGENTS.map(a => <option key={a.url} value={a.url}>{a.name}</option>)}
            </select>
            {tool && <div className="tool">正在调用工具: {tool}</div>}
          </div>
          <div className="messages">
            {messages.map((m,i) => (
              <div key={i} className={`message ${m.role}`}>{m.content}</div>
            ))}
            <div ref={endRef}></div>
          </div>
          <form onSubmit={send}>
            <textarea rows="2" value={input} onChange={e => setInput(e.target.value)} />
            <button type="submit">发送</button>
          </form>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
